name: Build and Test

on:
  workflow_dispatch:
  push:
    branches: [D]
  pull_request:
    branches: [D]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # LDC only. DMD does not perform tail call optimization, and Mizu's
      # dispatch depends on it — see "Tail calls" in the README.
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest

      - name: Install libffi (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libffi-dev

      - name: Install libffi (macOS)
        if: runner.os == 'macOS'
        run: brew install libffi

      # vcpkg builds libffi from source, which is slow enough to be worth
      # caching. Its archives are content-addressed, so a stale entry is
      # ignored rather than reused wrongly. The run id in the key is there
      # only so that every run writes an archive of its own and `restore-keys`
      # picks up the newest; a fixed key is saved once and never updated.
      #
      # downloads/ is cached alongside it because libffi is an autotools port:
      # vcpkg pulls down a private MSYS2 to run ./configure under, and those
      # packages are pinned to versions that repo.msys2.org eventually deletes.
      - name: Cache the vcpkg build of libffi
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.vcpkg/cache
            ${{ github.workspace }}/.vcpkg/downloads
          key: vcpkg-libffi-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: vcpkg-libffi-${{ hashFiles('vcpkg.json') }}-

      # Windows ships no libffi, so build one. The script reads vcpkg.json,
      # stages the result where dub.json's `lflags-windows` points the linker,
      # and explains the choice of triplet.
      - name: Build libffi (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg/cache
          VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg/downloads
        run: ./tools/vcpkg-libffi.ps1

      - name: Build the library
        run: dub build --config=library --compiler=ldc2

      - name: Run the tests
        run: dub test --compiler=ldc2

      # `dub test -c <config>` substitutes dub's own druntime-based unittest
      # runner, which registers nothing under -betterC and then reports success
      # having run no tests, so build this configuration and run it directly.
      - name: Run the tests against the coroutine scheduler
        run: |
          dub build -c unittest-coroutine --build=unittest --compiler=ldc2
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./bin/mizu-tests-coroutine.exe
          else
            ./bin/mizu-tests-coroutine
          fi
        shell: bash

      - name: Run the examples
        run: |
          for example in fib bubble threads; do
            dub run -c "example-$example" --compiler=ldc2
          done
        shell: bash
